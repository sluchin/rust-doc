name: Release

# v から始まるタグ (例: v0.1.0) を push すると, PC (Windows, macOS, Linux) と Android のビルドを作り,
# GitHub Releases のドラフトに載せる (中身を確かめて, 手で公開する). 手動実行 (workflow_dispatch) は,
# タグを打たずにビルドして, 成果物を Actions の Artifacts に保存する.
# Android の APK はデバッグ鍵で署名したデバッグ版 (リリース用の署名鍵は使っていない).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    permissions:
      contents: write # GitHub Releases への書き込み
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # 共通のコード (shared)

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin は Rust のターゲットではないので, macOS は 2 つを個別に入れる
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # PC のインストーラ (deb / rpm / AppImage / msi / nsis / dmg). タグのときだけ, ドラフトに載せる
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Rust Doc ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Windows: インストーラとは別に exe 単体のポータブル版 zip を作る
      - name: Create Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $zip = "rust-doc_${{ github.ref_name }}_windows_x64_portable.zip"
          Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/rust-doc.exe" -DestinationPath $zip
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable zip to release
        if: matrix.os == 'windows-latest' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" $env:PORTABLE_ZIP --clobber

      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-doc-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ${{ env.PORTABLE_ZIP }}
          if-no-files-found: error

  android:
    name: android
    needs: desktop # ドラフトのリリースを desktop が作ってから載せる
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build the development image
        uses: ./.github/actions/docker-image

      - name: Install the dependencies
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm install

      - name: Build the APK
        run: env UID="$(id -u)" GID="$(id -g)" docker compose run --rm build-android

      - name: Name the APK
        run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            "rust-doc_${{ github.ref_name }}_android_debug.apk"

      - name: Upload the APK to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "rust-doc_${{ github.ref_name }}_android_debug.apk" --clobber

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-doc-android
          path: "rust-doc_*_android_debug.apk"
          if-no-files-found: error
